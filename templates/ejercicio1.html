
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas y Asistencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="contenedor">
        <h1>Ejercicio 1</h1>
        <h2>Promedio de notas y asistencia</h2>

        <form method="POST" action="{{ url_for('ejercicio1') }}">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1"
                   min="10" max="70" step="0.1" required>

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2"
                   min="10" max="70" step="0.1" required>

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3"
                   min="10" max="70" step="0.1" required>

            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia"
                   min="0" max="100" step="0.1" required>

            <button type="submit" class="boton">Enviar</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if promedio is not none %}
            <div class="resultado">
                <h3>Resultado</h3>
                <p>Promedio: {{ promedio }}</p>
                <p>Estado: <strong>{{ estado }}</strong></p>
            </div>
        {% endif %}

        <a href="{{ url_for('inicio') }}" class="volver">
            Volver al menú principal
        </a>
    </main>
</body>
</html>
